
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Mídia Digital</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
  }
  #player {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: #000;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 1s ease-in-out;
    pointer-events: none;
  }
  .slide.active { opacity: 1; }
  .slide img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  #status {
    position: fixed;
    left: 12px;
    bottom: 10px;
    z-index: 10;
    color: rgba(255,255,255,.55);
    font-size: 12px;
    background: rgba(0,0,0,.35);
    padding: 5px 8px;
    border-radius: 5px;
    transition: opacity .5s;
  }
  body.fullscreen #status { display: none; }
</style>
</head>
 #clima {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 42px;
  background: rgba(0, 0, 0, 0.75);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  font-size: 18px;
  font-weight: bold;
  z-index: 9999;
}
<body>
<div id="player"></div>
<div id="status">Painel de Mídia Digital • modo teste</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyp0KvD4oEn33_3GvkSWu76DebCOGqNyVUyttZJBD_X-x-AXZ8CCTkeHLuo9eQpiy-L/exec";

const PAINEL = new URLSearchParams(window.location.search).get("painel") || "Painel-01";

 const CIDADE = "Guarujá";
const LATITUDE = -23.9931;
const LONGITUDE = -46.2563;

async function atualizarClima() {
  try {
    const resposta = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${LATITUDE}&longitude=${LONGITUDE}&current=temperature_2m,weather_code&timezone=America%2FSao_Paulo`
    );

    const dados = await resposta.json();

    const temperatura = Math.round(dados.current.temperature_2m);
    const codigo = dados.current.weather_code;

    let condicao = "Tempo estável";
    let icone = "🌤️";

    if (codigo === 0) {
      condicao = "Céu limpo";
      icone = "☀️";
    } else if ([1, 2, 3].includes(codigo)) {
      condicao = "Nublado";
      icone = "☁️";
    } else if ([45, 48].includes(codigo)) {
      condicao = "Neblina";
      icone = "🌫️";
    } else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(codigo)) {
      condicao = "Chuva";
      icone = "🌧️";
    } else if ([95, 96, 99].includes(codigo)) {
      condicao = "Tempestade";
      icone = "⛈️";
    }

    const clima = document.getElementById("clima");

    if (clima) {
      clima.innerHTML =
        `${icone} ${CIDADE} • ${temperatura}°C • ${condicao}`;
    }

  } catch (erro) {
    console.log("Erro ao consultar o clima:", erro);
  }
}

atualizarClima();

// Atualiza o clima a cada 10 minutos
setInterval(atualizarClima, 10 * 60 * 1000);

const player = document.getElementById("player");
const status = document.getElementById("status");


function limparUrl(valor) {

    if (!valor) return "";

    let url = String(valor).trim();

    // Caso venha como [texto](URL)
    const markdown = url.match(/\[.*?\]\((https?:\/\/[^)]+)\)/);

    if (markdown) {
        url = markdown[1];
    }

    // Corrige caracteres escapados
    url = url.replace(/\\&/g, "&");

    return url;
}


async function carregarAnuncios() {

    try {

        const resposta = await fetch(API_URL + "?t=" + Date.now());

        if (!resposta.ok) {
            throw new Error("Erro HTTP " + resposta.status);
        }

        const dados = await resposta.json();


        const anuncios = dados.filter(anuncio => {

            return (

                String(anuncio.status).toLowerCase() === "ativo"

                &&

                String(anuncio.painel).toLowerCase() === PAINEL.toLowerCase()

                &&

                limparUrl(anuncio.imagem) !== ""

            );

        });


        if (anuncios.length === 0) {

            player.innerHTML = "";

            status.textContent = "Nenhum anúncio ativo";

            return;

        }


        player.innerHTML = "";


        anuncios.forEach((anuncio, indice) => {

            const slide = document.createElement("div");

            slide.className = "slide";

            if (indice === 0) {
                slide.classList.add("active");
            }


            const imagem = document.createElement("img");

            imagem.src = limparUrl(anuncio.imagem);

            imagem.alt = anuncio.empresa || "Publicidade";


            slide.appendChild(imagem);

            player.appendChild(slide);

        });


        status.textContent =
            "Painel 01 • " +
            anuncios.length +
            " anúncios";


        const slides =
            [...document.querySelectorAll(".slide")];


        let atual = 0;


        function proximo() {

            if (slides.length <= 1) return;


            slides[atual].classList.remove("active");


            atual = (atual + 1) % slides.length;


            slides[atual].classList.add("active");


            const tempo =
                (Number(anuncios[atual].duracao) || 10) * 1000;


            setTimeout(proximo, tempo);

        }


        if (slides.length > 1) {

            const primeiroTempo =
                (Number(anuncios[0].duracao) || 10) * 1000;

            setTimeout(proximo, primeiroTempo);

        }


        setTimeout(() => {

            status.style.opacity = "0";

        }, 5000);


    }

    catch (erro) {

        console.error(erro);

        status.textContent =
            "Erro ao conectar ao Painel Mídia";

    }

}


// Primeira leitura
carregarAnuncios();


// Atualiza a programação a cada 60 segundos
setInterval(carregarAnuncios, 60000);


</script>
</body>
 <div id="clima"></div>
</html>
